name: Importar catalogo
on: workflow_dispatch
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar y descomprimir
        run: |
          set -e
          for id in 1RIAmAxSKofkdXuMzUVFgfGSkhuVQaZ6W 1v6ydQ7EncMoCJOfsWiYNsLd0kLlZuFgm 1jeoCiNVI5PRrOp35UVnbFAAc2UkCP5Og 1Vou_goxQNkB0Sy33YLCOQow_YDCYKIJq; do
            curl -sSL --fail -o "p_$id" "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t"
            ls -l "p_$id"
          done
          cat p_1RIAmAxSKofkdXuMzUVFgfGSkhuVQaZ6W p_1v6ydQ7EncMoCJOfsWiYNsLd0kLlZuFgm p_1jeoCiNVI5PRrOp35UVnbFAAc2UkCP5Og p_1Vou_goxQNkB0Sy33YLCOQow_YDCYKIJq > site.zip
          echo "c3e6f289f9afa930d6ac6591ddc2bdc5b101d4abc235f3a0c2f79d1ccf0683d2  site.zip" | sha256sum -c -
          unzip -o -q site.zip -d .
          rm -f site.zip p_*
          touch .nojekyll
      - name: Guardar en el repositorio
        run: |
          git config user.name "Traviesitos"
          git config user.email "traviesitos@users.noreply.github.com"
          git add -A
          git commit -m "Catalogo Traviesitos Children"
          git push
