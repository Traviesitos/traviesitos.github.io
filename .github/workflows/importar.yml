name: Importar catalogo
on:
  workflow_dispatch:
    inputs:
      ids:
        description: IDs de Google Drive de las partes, en orden y separados por espacio
        required: true
      sha:
        description: SHA-256 del zip completo
        required: true
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar y descomprimir
        env:
          IDS: ${{ inputs.ids }}
          SHA: ${{ inputs.sha }}
        run: |
          set -e
          rm -f site.zip
          for id in $IDS; do
            curl -sSL --fail -o p.part "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t"
            ls -l p.part
            cat p.part >> site.zip
          done
          echo "$SHA  site.zip" | sha256sum -c -
          rm -rf img sw vid
          unzip -o -q site.zip -d .
          rm -f site.zip p.part
          touch .nojekyll
      - name: Guardar en el repositorio
        run: |
          git config user.name "Traviesitos"
          git config user.email "traviesitos@users.noreply.github.com"
          git add -A
          git commit -m "Actualizar catalogo" || echo "sin cambios"
          git push
